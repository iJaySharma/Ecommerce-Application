spring.application.name=product-order-management

# ==========================================================
# DATABASE CONFIGURATION
# Default: H2 in-memory (zero setup, great for running/testing this assignment)
# Switch to MySQL or PostgreSQL by commenting the H2 block and
# uncommenting the block you need below.
# ==========================================================

# ---- H2 (default, in-memory) ----
spring.datasource.url=jdbc:h2:mem:pmsdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- MySQL ----
# spring.datasource.url=jdbc:mysql://localhost:3306/pmsdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root

# ---- PostgreSQL ----
# spring.datasource.url=jdbc:postgresql://localhost:5432/pmsdb
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================================
# JWT CONFIGURATION
# ==========================================================
app.jwt.secret=ThisIsASecretKeyForPMSAssignmentJWTSigningPurposeOnly1234567890
app.jwt.expiration-ms=86400000

# ==========================================================
# SERVER
# ==========================================================
server.port=8080

# ==========================================================
# LOGGING
# ==========================================================
logging.level.org.springframework.security=INFO
logging.level.com.pms=DEBUG
